<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>光国 · pet spritesheet player</title>
<style>
  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --ink: #232019;
    --dim: #7c7568;
    --line: #e4dfd6;
    --accent: #b07a28;
    --stage: #faf9f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171614;
      --card: #201e1b;
      --ink: #ece7dd;
      --dim: #9a9285;
      --line: #33302b;
      --accent: #d8a44e;
      --stage: #1b1a17;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 24px 64px;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.65 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }
  header { text-align: center; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; letter-spacing: .02em; }
  header p { margin: 0; color: var(--dim); font-size: 13px; }
  .stage {
    background: var(--stage);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px 22px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    box-shadow: 0 1px 0 rgba(0,0,0,.02), 0 12px 32px -24px rgba(0,0,0,.45);
  }
  .viewport {
    position: relative;
    width: calc(var(--w) * 1px);
    height: calc(var(--h) * 1px);
    cursor: pointer;
  }
  canvas { display: block; width: 100%; height: 100%; image-rendering: auto; }
  .hint {
    font-size: 12px; color: var(--dim); letter-spacing: .02em;
    user-select: none;
  }
  .meta { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--dim); }
  .controls {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    max-width: 760px;
  }
  button {
    font: inherit; font-size: 13px;
    padding: 7px 13px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
    transition: border-color .15s, color .15s, background .15s;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: #fff;
  }
  footer { color: var(--dim); font-size: 12px; text-align: center; max-width: 620px; }
  code { font-size: .92em; }
</style>
</head>
<body>

<header>
  <h1>光国 · spritesheet player</h1>
  <p>192 × 208 per frame · 8 columns × 9 rows · click the pet to say hello</p>
</header>

<div class="stage">
  <div class="viewport" id="viewport" title="点一下我">
    <canvas id="canvas"></canvas>
  </div>
  <div class="hint" id="hint">点一下 → 挥手</div>
  <div class="meta" id="meta"></div>
</div>

<div class="controls" id="controls"></div>

<footer>
  这个页面直接读 <code>../pet/spritesheet.png</code>，没有依赖、没有构建。
  帧数是从每行前几格是否透明推出来的，所以末格留空的行也播得对。
</footer>

<script>
// ---- atlas 描述（与 docs/format.md 一致）----
const FRAME_W = 192, FRAME_H = 208;
const LOOP_MS = 1600;                       // 一圈的总时长，来自 pet.json
const ROWS = [
  // [行名, 说明]
  ['idle',          '待机'],
  ['running-right', '走路·向右'],
  ['running-left',  '走路·向左'],
  ['waving',        '挥手'],
  ['jumping',       '跳跃'],
  ['failed',        '失败'],
  ['waiting',       '坐等'],
  ['running',       '原地跑'],
  ['review',        '审阅'],
];

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const viewport = document.getElementById('viewport');
const hintEl = document.getElementById('hint');
const metaEl = document.getElementById('meta');
const controls = document.getElementById('controls');

const SCALE = 2;
const dpr = Math.min(window.devicePixelRatio || 1, 2);

let sheet = null;
let counts = [];          // 每行实际帧数（由透明格推出）
let rowIndex = 0;
let frame = 0;
let last = performance.now();
let waveUntil = 0;        // 点一下的挥手覆盖

function resizeCanvas() {
  canvas.width = FRAME_W * SCALE * dpr;
  canvas.height = FRAME_H * SCALE * dpr;
  viewport.style.setProperty('--w', FRAME_W * SCALE);
  viewport.style.setProperty('--h', FRAME_H * SCALE);
}

// 数一行里有几格不是空的：图集是把帧从左边排起、末格留空
function countFrames(img, row) {
  const probe = document.createElement('canvas');
  probe.width = FRAME_W; probe.height = FRAME_H;
  const pctx = probe.getContext('2d', { willReadFrequently: true });
  let n = 0;
  for (let c = 0; c < 8; c++) {
    pctx.clearRect(0, 0, FRAME_W, FRAME_H);
    pctx.drawImage(img, c * FRAME_W, row * FRAME_H, FRAME_W, FRAME_H, 0, 0, FRAME_W, FRAME_H);
    const data = pctx.getImageData(0, 0, FRAME_W, FRAME_H).data;
    let filled = false;
    for (let i = 3; i < data.length; i += 4) {
      if (data[i] > 8) { filled = true; break; }
    }
    if (!filled) break;
    n++;
  }
  return n;
}

function draw() {
  if (!sheet) return;
  const row = ROWS[rowIndex][0];
  const r = ROWS.findIndex(([name]) => name === row);
  const count = counts[r] || 1;
  ctx.setTransform(dpr * SCALE, 0, 0, dpr * SCALE, 0, 0);
  ctx.clearRect(0, 0, FRAME_W, FRAME_H);
  ctx.drawImage(
    sheet,
    frame * FRAME_W, r * FRAME_H, FRAME_W, FRAME_H,
    0, 0, FRAME_W, FRAME_H
  );
}

function tick(now) {
  const loopMs = LOOP_MS;
  const count = counts[rowIndex] || 1;
  const step = loopMs / count;

  if (now - last >= step) {
    last = now;
    frame = (frame + 1) % count;
    draw();
  }
  requestAnimationFrame(tick);
}

function setRow(name) {
  const i = ROWS.findIndex(([n]) => n === name);
  if (i < 0) return;
  rowIndex = i;
  frame = 0;
  last = performance.now();
  hintEl.textContent = name === 'waiting' ? '点一下 → 挥手' : ROWS[i][1] + ' · 点一下 → 挥手';
  updateControls();
  draw();
}

function updateControls() {
  [...controls.children].forEach((b, i) => {
    b.setAttribute('aria-pressed', String(i === rowIndex));
  });
  const count = counts[rowIndex] || 0;
  metaEl.textContent = `${ROWS[rowIndex][0]} · ${count} 帧 · 每帧 ≈${Math.round(LOOP_MS / Math.max(count, 1))}ms`;
}

function wave() {
  const i = ROWS.findIndex(([n]) => n === 'waving');
  if (i < 0) return;
  const back = { row: rowIndex, frame };
  rowIndex = i; frame = 0; last = performance.now();
  hintEl.textContent = '嗨～';
  updateControls();
  draw();
  clearTimeout(wave._t);
  wave._t = setTimeout(() => {
    rowIndex = back.row; frame = 0; last = performance.now();
    hintEl.textContent = '点一下 → 挥手';
    updateControls(); draw();
  }, LOOP_MS);
}

viewport.addEventListener('click', wave);

ROWS.forEach(([name, label]) => {
  const b = document.createElement('button');
  b.textContent = label;
  b.onclick = () => setRow(name);
  controls.appendChild(b);
});

resizeCanvas();
const img = new Image();
img.onload = () => {
  sheet = img;
  counts = ROWS.map((_, r) => countFrames(img, r));
  setRow('idle');
  requestAnimationFrame(tick);
};
img.onerror = () => {
  hintEl.textContent = '读不到 ../pet/spritesheet.png —— 用本地 http 服务器打开（见 README）';
};
img.src = '../pet/spritesheet.png';
</script>
</body>
</html>
